name: Compilar Chamos

on:
  workflow_dispatch:

env:
  VERSION_BASE: v26.10.1
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar el código base (Element X Android, licencia AGPL-3.0)
        run: git clone --depth 1 --branch $VERSION_BASE https://github.com/element-hq/element-x-android chamos

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cambiar nombre, textos e identificador a Chamos
        working-directory: chamos
        run: |
          sed -i 's/APPLICATION_ID = "io.element.android.x"/APPLICATION_ID = "com.chamos.app"/' plugins/src/main/kotlin/config/BuildTimeConfig.kt
          sed -i 's/APPLICATION_NAME = "Element X"/APPLICATION_NAME = "Chamos"/' plugins/src/main/kotlin/config/BuildTimeConfig.kt
          sed -i 's/"$baseAppName dbg"/baseAppName/' app/build.gradle.kts
          grep -n 'com.chamos.app\|"Chamos"' plugins/src/main/kotlin/config/BuildTimeConfig.kt
          grep -n 'app_name", baseAppName' app/build.gradle.kts
          grep -rl "Element X" --include=localazy.xml --include=translations.xml . | xargs -r sed -i 's/Element X/Chamos/g'

      - name: Cambiar el ícono a Chamos
        run: |
          pip install pillow
          cat > rebrand.py <<'EOF'
          # Cambia el ícono a "Chamos": dos chamos con la gorra hacia atrás chocando puños dentro de una burbuja de chat (dibujo original). Uso: python3 rebrand.py RAIZ_DEL_REPO
          import sys, os, re
          from PIL import Image, ImageDraw, ImageOps

          root = sys.argv[1]
          res = os.path.join(root, "appicon/element/src/main/res")
          BG = "#EAF7EF"
          GREEN = "#25D366"
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          W = (255, 255, 255, 255)
          CLEAR = (0, 0, 0, 0)

          def chamo(cap, cap_dark, skin, skin_shadow, ink, white, detail, glasses=False, phones=False):
              S = 1000
              img = Image.new("RGBA", (S, S), CLEAR)
              d = ImageDraw.Draw(img)
              d.rounded_rectangle((405, 640, 595, 760), 40, fill=skin_shadow)
              d.pieslice((190, 700, 810, 1180), 180, 360, fill=cap)
              d.ellipse((222, 440, 322, 580), fill=skin_shadow)
              d.ellipse((678, 440, 778, 580), fill=skin_shadow)
              d.rounded_rectangle((258, 300, 742, 720), 210, fill=skin)
              d.pieslice((246, 140, 754, 620), 180, 360, fill=cap)
              d.rectangle((246, 380, 754, 420), fill=cap_dark)
              d.rounded_rectangle((440, 392, 560, 452), 14, fill=cap_dark)
              if detail:
                  for x in (468, 500, 532):
                      d.ellipse((x - 7, 412, x + 7, 426), fill="#FFFFFF")
              if phones:
                  mono = ink == CLEAR
                  band, accent = (W, W) if mono else ("#2B2F36", "#FFD54F")
                  if mono:
                      d.arc((204, 80, 796, 820), 180, 360, fill=CLEAR, width=58)
                      for box in ((172, 396, 288, 624), (712, 396, 828, 624)):
                          d.rounded_rectangle((box[0] - 14, box[1] - 14, box[2] + 14, box[3] + 14), 60, fill=CLEAR)
                  d.arc((212, 90, 788, 810), 180, 360, fill=band, width=30)
                  for box in ((180, 404, 280, 616), (720, 404, 820, 616)):
                      d.rounded_rectangle(box, 46, fill=band)
                      if not mono:
                          d.rounded_rectangle((box[0] + 22, box[1] + 36, box[2] - 22, box[3] - 36), 26, fill=accent)
              d.polygon([(700, 300), (880, 270), (905, 330), (730, 380)], fill=cap_dark)
              for cx in (385, 615):
                  d.ellipse((cx - 38, 500, cx + 38, 590), fill=white)
                  d.ellipse((cx - 18, 525, cx + 18, 575), fill=ink)
                  d.line((cx - 55, 478, cx + 50, 470 if cx < 500 else 462), fill=ink, width=16)
              d.arc((395, 575, 605, 705), 20, 160, fill=ink, width=20)
              if glasses:
                  lens = CLEAR if ink == CLEAR else "#101418"
                  d.rounded_rectangle((318, 488, 478, 598), 34, fill=lens)
                  d.rounded_rectangle((522, 488, 682, 598), 34, fill=lens)
                  d.rectangle((470, 510, 530, 528), fill=lens)
                  d.line((258, 505, 320, 510), fill=lens, width=14)
                  d.line((742, 505, 680, 510), fill=lens, width=14)
                  if lens != CLEAR:
                      d.line((340, 510, 380, 510), fill="#6B7A8A", width=10)
                      d.line((544, 510, 584, 510), fill="#6B7A8A", width=10)
              return img

          def inner(size, mono=False):
              S = 1000
              skin = W if mono else "#C98B5B"
              shade = W if mono else "#B77A4B"
              ink = CLEAR if mono else "#2B1B12"
              white = CLEAR if mono else "#FFFFFF"
              blue = (W, W) if mono else ("#229ED9", "#1A7DB0")
              red = (W, W) if mono else ("#E53935", "#B71C1C")
              left = chamo(blue[0], blue[1], skin, shade, ink, white, not mono, phones=True)
              right = ImageOps.mirror(chamo(red[0], red[1], skin, shade, ink, white, not mono, glasses=True))
              sc = 560
              left = left.resize((sc, sc), Image.LANCZOS)
              right = right.resize((sc, sc), Image.LANCZOS)
              canvas = Image.new("RGBA", (S, S), CLEAR)
              canvas.alpha_composite(left, (-40, 150))
              canvas.alpha_composite(right, (480, 150))
              d = ImageDraw.Draw(canvas)
              # brazos: manga del color de la camisa y antebrazo de piel, hacia el centro
              d.line((300, 725, 420, 700), fill=blue[0], width=86)
              d.line((700, 725, 580, 700), fill=red[0], width=86)
              d.ellipse((248, 682, 332, 768), fill=blue[0])
              d.ellipse((668, 682, 752, 768), fill=red[0])
              d.line((405, 702, 452, 694), fill=skin, width=62)
              d.line((595, 702, 548, 694), fill=skin, width=62)
              d.ellipse((425, 648, 510, 738), fill=skin)
              d.ellipse((490, 648, 575, 738), fill=skin)
              if not mono:
                  d.line((500, 658, 500, 728), fill=shade, width=5)
                  for (x1, y1, x2, y2) in ((500, 590, 500, 625), (438, 603, 460, 631), (562, 603, 540, 631)):
                      d.line((x1, y1, x2, y2), fill="#FFFFFF", width=12)
              return canvas.resize((size, size), Image.LANCZOS)

          def scene(size, mono=False):
              S = 1000
              base = Image.new("RGBA", (S, S), CLEAR)
              d = ImageDraw.Draw(base)
              tail = [(640, 760), (800, 940), (480, 770)]
              box = (70, 110, 930, 790)
              if mono:
                  d.rounded_rectangle(box, 210, outline=W, width=46)
                  d.polygon(tail, fill=W)
              else:
                  d.rounded_rectangle(box, 210, fill=GREEN)
                  d.polygon(tail, fill=GREEN)
              inn = inner(S, mono).resize((800, 800), Image.LANCZOS)
              base.alpha_composite(inn, (100, 70))
              return base.resize((size, size), Image.LANCZOS)

          def tight(img, scale):
              n = int(img.width * scale)
              small = img.resize((n, n), Image.LANCZOS)
              out = Image.new("RGBA", img.size, CLEAR)
              o = (img.width - n) // 2
              out.alpha_composite(small, (o, o))
              return out

          def save(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "WEBP", quality=95)

          for name, k in dens.items():
              d = os.path.join(res, "mipmap-" + name)
              fg = int(108 * k)
              save(tight(scene(fg), 0.60), os.path.join(d, "ic_launcher_foreground.webp"))
              save(tight(scene(fg, mono=True), 0.60), os.path.join(d, "ic_launcher_monochrome.webp"))
              lg = int(48 * k)
              sq = Image.new("RGBA", (lg, lg), BG)
              sq.alpha_composite(tight(scene(lg), 0.92))
              save(sq, os.path.join(d, "ic_launcher.webp"))
              mask = Image.new("L", (lg * 4, lg * 4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, lg * 4 - 1, lg * 4 - 1), fill=255)
              mask = mask.resize((lg, lg), Image.LANCZOS)
              rnd = Image.new("RGBA", (lg, lg), CLEAR)
              rnd.paste(sq, (0, 0), mask)
              save(rnd, os.path.join(d, "ic_launcher_round.webp"))

          for variant in ("debug", "nightly", "release"):
              p = os.path.normpath(os.path.join(res, "..", "..", variant, "res/drawable/ic_launcher_background.xml"))
              if os.path.exists(p):
                  t = open(p).read()
                  t = re.sub(r'android:fillColor="#[0-9A-Fa-f]{6,8}"', 'android:fillColor="%s"' % BG, t)
                  open(p, "w").write(t)
          print("Ícono de Chamos generado")
          EOF
          python3 rebrand.py chamos

      - name: Compilar APK
        working-directory: chamos
        run: ./gradlew :app:assembleFDroidDebug --stacktrace --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: chamos-apk
          path: chamos/app/build/outputs/apk/fdroid/debug/*universal-debug.apk
